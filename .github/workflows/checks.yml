name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            dev/requirements.txt
            dev/constraints.txt
            dev/requirements-dev.txt
      - name: Install tested dependencies
        run: python -m pip install -r dev/requirements.txt -c dev/constraints.txt -r dev/requirements-dev.txt
      - name: Compile and validate repository
        run: |
          python -m compileall -q src dev
          python dev/repository_check.py
      - name: Offline regressions
        run: |
          python dev/core_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/access_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/readability_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/natural_contract_check.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python dev/model_matrix_check.py
      - name: Audit Python dependencies
        run: |
          python -m pip install -r dev/requirements-audit.txt
          python -m pip_audit --no-deps --disable-pip -r dev/constraints.txt --strict
